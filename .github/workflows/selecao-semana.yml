name: Seleção da semana (Instagram)

# Toda segunda: carrossel de 10 slides com 8 imoveis de Venda Direta /
# Venda Online (comissao do corretor paga pela Caixa), no visual Raio-X.
# Resultado em https://reginaldorosso.com.br/social/ (noindex) com a
# legenda pronta. A postagem continua manual (ou pelo Publora).

on:
  schedule:
    - cron: "17 10 * * 1"   # segunda 07:17 BRT, antes do Raio-X diario
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cards-instagram
  cancel-in-progress: false

jobs:
  semana:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install "pillow>=10.3" "numpy>=1.26"

      - name: Gerar carrossel
        env:
          TZ: America/Sao_Paulo
        run: python scripts/selecao_semana.py

      - name: Publicar
        run: |
          git config user.name "robo-imoveis"
          git config user.email "robo@users.noreply.github.com"
          git add -A social/
          git diff --cached --quiet && { echo "Sem mudanças."; exit 0; }
          git commit -m "Seleção da semana ($(TZ=America/Sao_Paulo date +%F))"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 10
          done
          exit 1
