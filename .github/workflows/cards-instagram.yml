name: Cards Instagram (diário)

# Gera 1 card + legenda por UF (RS e SC) com a melhor oportunidade do dia,
# a partir de imoveis-rs.json / imoveis-sc.json ja publicados no site.
# Resultado em https://reginaldorosso.com.br/social/ (noindex, fora do
# sitemap) com botoes "Baixar imagem" e "Copiar legenda".
# Nao publica sozinho no Instagram: a postagem continua manual.

on:
  schedule:
    - cron: "47 10 * * *"   # 07:47 BRT, depois da atualizacao noturna dos imoveis
  workflow_dispatch:
    inputs:
      uf:
        description: "RS, SC ou vazio para os dois"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: cards-instagram
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install "pillow>=10.3" "numpy>=1.26"

      - name: Gerar cards
        env:
          TZ: America/Sao_Paulo
          UF: ${{ github.event.inputs.uf }}
        run: |
          if [ -n "$UF" ]; then python scripts/cards_instagram.py --uf "$UF"; else python scripts/cards_instagram.py; fi

      - name: Publicar
        run: |
          git config user.name "robo-imoveis"
          git config user.email "robo@users.noreply.github.com"
          git add -A social/
          git diff --cached --quiet && { echo "Sem cards novos."; exit 0; }
          git commit -m "Cards Instagram ($(TZ=America/Sao_Paulo date +%F))"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 10
          done
          exit 1
