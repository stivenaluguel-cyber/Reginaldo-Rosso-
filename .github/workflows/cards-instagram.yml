name: Cards Instagram (diário)

# Posts do @regirossoleiloes no visual Raio-X, so com Venda Direta / Venda
# Online (comissao do corretor paga pela Caixa):
#   - todo dia 07:47 BRT: Raio-X de RS e de SC (scripts/cards_instagram.py)
#   - segunda 07:17 BRT: Selecao da semana, carrossel de 10 slides
#     (scripts/selecao_semana.py)
# Resultado em https://reginaldorosso.com.br/social/ (noindex, fora do
# sitemap) com "Baixar" e "Copiar legenda". Nao publica no Instagram sozinho.
# A selecao tambem gera https://reginaldorosso.com.br/lista/ (link que a automacao
# do direct manda para quem comenta LISTA).
#   - a cada 15 min: direct automatico (scripts/direct_automatico.py): quem
#     comenta LISTA/QUERO/CAIXA ou manda LISTA no direct recebe o link da lista.
#     Precisa do secret IG_TOKEN; sem ele so avisa e sai. Nao gera commit.

on:
  schedule:
    - cron: "47 10 * * *"   # diario, 07:47 BRT
    - cron: "17 10 * * 1"   # segunda, 07:17 BRT: selecao da semana
    - cron: "*/15 * * * *"  # direct automatico
  workflow_dispatch:
    inputs:
      tarefa:
        description: "diario, semana, ambos, refazer (refaz as artes de hoje e da semana com os mesmos imoveis) ou direct (roda o direct automatico agora)"
        required: false
        default: "diario"
      uf:
        description: "Só para o diário: RS, SC ou vazio para os dois"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  cards:
    if: github.event.schedule != '*/15 * * * *' && github.event.inputs.tarefa != 'direct'
    concurrency:
      group: cards-instagram
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install "pillow>=10.3" "numpy>=1.26"

      - name: Gerar posts
        env:
          TZ: America/Sao_Paulo
          AGENDA: ${{ github.event.schedule }}
          TAREFA: ${{ github.event.inputs.tarefa }}
          UF: ${{ github.event.inputs.uf }}
        run: |
          if [ "$AGENDA" = "17 10 * * 1" ]; then TAREFA=semana; fi
          TAREFA=${TAREFA:-diario}
          if [ "$TAREFA" = "refazer" ]; then
            python scripts/selecao_semana.py --refazer
          fi
          if [ "$TAREFA" = "semana" ] || [ "$TAREFA" = "ambos" ]; then
            python scripts/selecao_semana.py
          fi
          if [ "$TAREFA" = "diario" ] || [ "$TAREFA" = "ambos" ] || [ "$TAREFA" = "refazer" ]; then
            if [ -n "$UF" ]; then python scripts/cards_instagram.py --uf "$UF"; else python scripts/cards_instagram.py; fi
          fi

      - name: Publicar
        run: |
          git config user.name "robo-imoveis"
          git config user.email "robo@users.noreply.github.com"
          git add -A social/ lista/
          git diff --cached --quiet && { echo "Sem posts novos."; exit 0; }
          git commit -m "Posts Instagram ($(TZ=America/Sao_Paulo date +%F))"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 10
          done
          exit 1

  direct:
    if: github.event.schedule == '*/15 * * * *' || github.event.inputs.tarefa == 'direct'
    concurrency:
      group: direct-automatico
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Estado (cache, fora do repositorio)
        uses: actions/cache@v4
        with:
          path: social/direct/estado.json
          key: direct-estado-${{ github.run_id }}
          restore-keys: direct-estado-

      - name: Responder comentarios e directs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 scripts/direct_automatico.py
